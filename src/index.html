<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body class="min-h-screen bg-gray-900 flex items-center justify-center px-4">

    <!-- Main Box -->
    <div class="w-full max-w-md p-0.5 rounded-xl bg-linear-to-r from-purple-500 to-blue-400">

        <!-- Login Card -->
        <div class="bg-slate-900 rounded-xl p-6">

            <!-- Heading -->
            <div class="text-center mb-6">

                <h1 class="text-3xl font-bold text-white">
                    Welcome Back
                </h1>

                <p class="text-gray-400 mt-2">
                    Sign in to continue
                </p>

            </div>


            <!-- Login Form -->
            <form action="#" method="post">

                <!-- Email -->
                <div class="mb-5">

                    <label for="email" class="block text-sm text-gray-300 mb-2">
                        Email
                    </label>

                    <input id="email" name="email" type="email" placeholder="Enter your email" required
                        class="w-full h-11 px-3 bg-slate-800 border border-slate-700 rounded-md text-white placeholder:text-gray-500 outline-none focus:border-indigo-400">

                </div>


                <!-- Password -->
                <div class="mb-4">

                    <div class="flex justify-between mb-2">

                        <label for="password" class="text-sm text-gray-300">
                            Password
                        </label>

                        <a href="#" class="text-sm text-indigo-400">
                            Forgot Password?
                        </a>
                    </div>

                    <input id="password" name="password" type="password" placeholder="Enter your password" required
                        class="w-full h-11 px-3 bg-slate-800 border border-slate-700 rounded-md text-white placeholder:text-gray-500 outline-none focus:border-indigo-400">

                </div>


                <!-- Login Button -->
                <button type="submit"
                    class="w-full h-11 mt-6 bg-green-500 hover:bg-green-600 rounded-md text-white font-semibold">
                    <i class="fa-solid fa-check mr-1"></i>
                    Success!
                </button>

            </form>


            <!-- Sign Up -->
            <p class="text-center text-sm text-gray-400 mt-5">

                Don't have an account?

                <a href="#" class="text-indigo-400">
                    Sign Up
                </a>

            </p>


            <!-- Divider -->
            <div class="flex items-center gap-3 my-6">

                <div class="h-px bg-gray-700 flex-1"></div>

                <span class="text-xs text-gray-500">
                    Or continue with
                </span>

                <div class="h-px bg-gray-700 flex-1"></div>

            </div>


            <!-- Social Login -->
            <div class="flex gap-3">

                <button type="button"
                    class="flex-1 h-10 border border-slate-700 rounded-md text-sm text-white hover:bg-slate-800">
                    <i class="fa-brands fa-google mr-2"></i>
                    Google
                </button>

                <button type="button"
                    class="flex-1 h-10 border border-slate-700 rounded-md text-sm text-white hover:bg-slate-800">
                    <i class="fa-brands fa-facebook-f mr-2"></i>
                    Facebook
                </button>

            </div>

        </div>

    </div>
</body>

</html>
